name: Build and publish release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build release package
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: auto-hr-release
          path: release/auto-hr-release.zip
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          RELEASE_PRERELEASE: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          release_args=(--title "$RELEASE_NAME" --target "$GITHUB_SHA" --generate-notes)
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/auto-hr-release.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/auto-hr-release.zip "${release_args[@]}"
          fi
      - name: Retain latest five prereleases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expired_tags < <(gh release list --limit 100 \
            --json tagName,createdAt,isPrerelease,isDraft \
            --jq "map(select(.isPrerelease == true and .isDraft == false)) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName")
          for tag in "${expired_tags[@]}"; do
            gh release delete "$tag" --cleanup-tag --yes
          done

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auto-hr-release
      - name: Check deployment configuration
        id: deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_WEB_ROOT: ${{ secrets.DEPLOY_WEB_ROOT }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_WEB_ROOT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_WEB_ROOT repository secrets."
          fi
      - name: Configure deployment key
        if: steps.deployment.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy packaged release
        if: steps.deployment.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_WEB_ROOT: ${{ secrets.DEPLOY_WEB_ROOT }}
          DEPLOY_INITIAL_ENV: ${{ secrets.DEPLOY_INITIAL_ENV }}
          DEPLOY_SKIP_COTURN: ${{ secrets.DEPLOY_SKIP_COTURN }}
        run: |
          deploy_web_root_b64="$(printf '%s' "$DEPLOY_WEB_ROOT" | base64 | tr -d '\n')"
          deploy_skip_coturn_b64="$(printf '%s' "$DEPLOY_SKIP_COTURN" | base64 | tr -d '\n')"
          trap 'rm -f deploy-initial.env' EXIT
          scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new auto-hr-release.zip "$DEPLOY_USER@$DEPLOY_HOST:/tmp/auto-hr-release.zip"
          if [ -n "$DEPLOY_INITIAL_ENV" ]; then
            umask 077
            printf '%s' "$DEPLOY_INITIAL_ENV" > deploy-initial.env
            scp -p -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new deploy-initial.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/auto-hr-initial.env"
            rm -f deploy-initial.env
          fi
          ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
          "DEPLOY_WEB_ROOT_B64='$deploy_web_root_b64' DEPLOY_SKIP_COTURN_B64='$deploy_skip_coturn_b64' bash -s" <<'REMOTE'
          set -euo pipefail

          release_tmp=""
          cleanup() {
            rm -f /tmp/auto-hr-release.zip /tmp/auto-hr-initial.env
            case "$release_tmp" in
              /tmp/auto-hr-release.*) rm -rf -- "$release_tmp" ;;
            esac
          }
          trap cleanup EXIT

          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          fi
          release_tmp="$(mktemp -d /tmp/auto-hr-release.XXXXXX)"
          RELEASE_TMP="$release_tmp" python3 - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          archive_path = Path("/tmp/auto-hr-release.zip")
          destination_root = Path(os.environ["RELEASE_TMP"]).resolve(strict=True)
          with zipfile.ZipFile(archive_path) as archive:
              for member in archive.infolist():
                  destination = (destination_root / member.filename).resolve()
                  if destination != destination_root and destination_root not in destination.parents:
                      raise SystemExit(f"Unsafe path in release archive: {member.filename}")
                  archive.extract(member, destination_root)
          PY

          release_root="$release_tmp/auto-hr-release"
          test -s "$release_root/deploy.sh"
          deploy_web_root="$(printf '%s' "$DEPLOY_WEB_ROOT_B64" | base64 --decode)"
          deploy_skip_coturn="$(printf '%s' "$DEPLOY_SKIP_COTURN_B64" | base64 --decode)"
          deploy_args=(--web-root "$deploy_web_root")
          if ! sudo test -s /opt/auto-hr/.env && [ -s /tmp/auto-hr-initial.env ]; then
            deploy_args+=(--env /tmp/auto-hr-initial.env)
          fi
          case "${deploy_skip_coturn,,}" in
            1|true|yes) deploy_args+=(--skip-coturn) ;;
          esac
          sudo bash "$release_root/deploy.sh" "${deploy_args[@]}"
          REMOTE
