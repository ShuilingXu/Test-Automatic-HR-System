name: Build and publish release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build release package
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: auto-hr-release
          path: release/auto-hr-release.zip
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/auto-hr-release.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auto-hr-release
      - name: Check deployment configuration
        id: deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_WEB_ROOT: ${{ secrets.DEPLOY_WEB_ROOT }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_WEB_ROOT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_WEB_ROOT repository secrets."
          fi
      - name: Configure deployment key
        if: steps.deployment.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy and restart service
        if: steps.deployment.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_WEB_ROOT: ${{ secrets.DEPLOY_WEB_ROOT }}
        run: |
          scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new auto-hr-release.zip "$DEPLOY_USER@$DEPLOY_HOST:/tmp/auto-hr-release.zip"
          ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_WEB_ROOT='$DEPLOY_WEB_ROOT' bash -s" <<'REMOTE'
            set -euo pipefail
            sudo install -d -m 0755 /opt/auto-hr "$DEPLOY_WEB_ROOT"
            sudo rm -rf /tmp/auto-hr-release
            sudo python3 -c 'import zipfile; zipfile.ZipFile("/tmp/auto-hr-release.zip").extractall("/tmp/auto-hr-release")'
            sudo cp -a /tmp/auto-hr-release/auto-hr-release/. /opt/auto-hr/
            sudo cp -a /opt/auto-hr/frontend/. "$DEPLOY_WEB_ROOT"/
            sudo chmod 0755 /opt/auto-hr/start.sh
            sudo install -m 0644 /opt/auto-hr/auto-hr.service /etc/systemd/system/auto-hr.service
            sudo systemctl daemon-reload
            sudo systemctl enable auto-hr
            sudo systemctl restart auto-hr
            for attempt in $(seq 1 30); do
              if sudo systemctl is-active --quiet auto-hr && curl --fail --silent --show-error http://127.0.0.1:8081/api/auth/captcha >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            sudo systemctl status auto-hr --no-pager
            exit 1
          REMOTE
